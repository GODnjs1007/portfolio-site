global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"], labels: { name: monitoring } }]

  # 서버별 CPU·메모리·디스크·네트워크. 서버 추가는 targets.local.yml만 고치면 됨 (재시작 불필요)
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets.local.yml]
        refresh_interval: 30s

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"], labels: { name: portfolio } }]
