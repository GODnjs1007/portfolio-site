# 서버 목록 예시. 실제 IP는 같은 폴더의 targets.local.yml에 넣는다 (깃에 안 올라감)
#   cp targets.example.yml targets.local.yml 후 <...> 자리를 실제 Tailscale IP로 바꾸기
# 이름(name)은 대시보드 범례에 그대로 나옴
# portfolio는 같은 도커 네트워크라 컨테이너 이름으로, 나머지는 Tailscale IP로 접근
- targets: ["node-exporter:9100"]
  labels: { name: portfolio }
- targets: ["<paper Tailscale IP>:9100"]
  labels: { name: paper }
- targets: ["<ecg Tailscale IP>:9100"]
  labels: { name: ecg }
- targets: ["<proxmox Tailscale IP>:9100"]
  labels: { name: proxmox }
