# 포트폴리오 사이트 Nginx 설정 (portfolio VM의 site 컨테이너에 붙임)
# Cloudflare Tunnel 안쪽에선 http로만 받기 때문에, Nginx가 주소를 고쳐 돌려보낼 때
# http://ihaewon.com/... 처럼 http를 붙이면 자물쇠가 사라진다.
# absolute_redirect off → "/projects/" 처럼 경로만 돌려보내서 브라우저가 https를 유지한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
