{{- $projects := where (where site.RegularPages "Section" "projects") "Draft" false -}}
<div class="list">
<table>
  <thead><tr><th scope="col">프로젝트</th><th scope="col">분류</th><th scope="col">내 역할</th><th scope="col">상태</th><th scope="col">기간</th></tr></thead>
  <tbody>
  {{ range $projects.ByWeight }}
    <tr{{ if .Params.preview }} class="pre"{{ end }}><td>{{ if .Params.preview }}{{ .Title }}<small>상세 준비 중</small>{{ else }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</td><td>{{ .Params.category }}</td><td>{{ .Params.role }}</td><td>{{ .Params.status }}</td><td>{{ .Params.period }}</td></tr>
  {{ end }}
  </tbody>
</table>
</div>
