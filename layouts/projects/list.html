{{ define "main" }}
<section class="intro">
  <h1>{{ .Title }}</h1>
  <p>{{ .Params.summary }}</p>
</section>
<section aria-labelledby="h-map">
  <div class="sec-head"><h2 id="h-map">{{ i18n "projectsMap" }}</h2>
    <p class="legend"><span>{{ i18n "legendProject" }}</span><span class="l-here">{{ i18n "legendHere" }}</span><span class="l-draft">{{ i18n "legendPreview" }}</span></p></div>
  {{ partial "map.html" . }}
</section>
<section class="list" aria-labelledby="h-list">
  <div class="sec-head"><h2 id="h-list">{{ i18n "projectsList" }}</h2></div>
  {{ partial "project-table.html" . }}
</section>
{{ end }}
